<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diseñador de Melamina — Despiece, Optimización y Costeo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/estilos.css">
</head>
<body>
<div id="app">
  <header>
    <div class="logo">
      <div class="mk">M</div>
      <div>Diseñador de Melamina<small>Despiece · Optimización · Costeo</small></div>
    </div>
    <div class="sp"></div>
    <div class="hbtns">
      <button class="btn" id="bNew">＋ <span class="lbl">Módulo</span></button>
      <button class="btn" id="bSave">⤓ <span class="lbl">Guardar</span></button>
      <button class="btn" id="bLoad">⤒ <span class="lbl">Abrir</span></button>
      <button class="btn pri" id="bPrint">🖨 <span class="lbl">Imprimir</span></button>
    </div>
  </header>

  <main>
    <!-- LEFT -->
    <aside id="left">
      <div class="ptitle">Módulos del proyecto<div class="sp"></div><span id="modcount" class="pill">0</span></div>
      <div id="modlist"></div>
      <div id="presets">
        <div class="lbl">Plantillas rápidas</div>
        <div class="pgrid" id="pgrid"></div>
      </div>
    </aside>

    <!-- CENTER -->
    <div id="center" class="mshow">
      <div id="tabs">
        <button class="tab on" data-p="p3d"><span>◳</span> Vista 3D</button>
        <button class="tab" data-p="p2d"><span>▦</span> Plano 2D</button>
        <button class="tab" data-p="pdes"><span>☰</span> Despiece <b id="bdes">0</b></button>
        <button class="tab" data-p="popt"><span>▭</span> Planchas <b id="bopt">0</b></button>
        <button class="tab" data-p="pcos"><span>◎</span> Costeo</button>
      </div>
      <div id="view">
        <div class="pane" id="p2d">
          <div class="cvwrap">
            <canvas id="cv2"></canvas>
            <canvas id="cv2b" class="solo-imp"></canvas>
            <div class="cvbar">
              <button class="btn on" id="b2f">Frontal</button>
              <button class="btn" id="b2l">Lateral</button>
              <button class="btn on" id="b2dim">Cotas</button>
            </div>
            <div class="cvhint">Vista a escala con cotas en mm</div>
          </div>
        </div>
        <div class="pane on" id="p3d">
          <div class="cvwrap">
            <canvas id="cv3"></canvas>
            <div class="cvbar">
              <button class="btn" id="b3fit">⤢ Encuadrar</button>
              <button class="btn on" id="b3door">Puertas</button>
              <button class="btn on" id="b3back">Fondo</button>
              <button class="btn" id="b3all">Todo el proyecto</button>
            </div>
            <div class="cvhint">Arrastra para girar · Rueda o pinza para zoom</div>
            <div class="leg" id="leg3"></div>
          </div>
        </div>
        <div class="pane" id="pdes"><div class="scroll" id="desbox"></div></div>
        <div class="pane" id="popt"><div class="scroll" id="optbox"></div></div>
        <div class="pane" id="pcos"><div class="scroll" id="cosbox"></div></div>
      </div>
    </div>

    <!-- RIGHT -->
    <div id="rightp">
      <div class="ptitle">Parámetros</div>
      <div id="params"></div>
    </div>
  </main>

  <div id="mtabs">
    <button data-m="left"><span>☰</span>Módulos</button>
    <button class="on" data-m="center"><span>◳</span>Vista</button>
    <button data-m="rightp"><span>⚙</span>Ajustes</button>
  </div>
</div>
<div id="toast"></div>
<input type="file" id="fileIn" accept=".json" style="display:none">

<script src="js/utilidades.js"></script>
<script src="js/nucleo/estado.js"></script>
<script src="js/nucleo/despiece.js"></script>
<script src="js/nucleo/corte.js"></script>
<script src="js/vistas/vista3d.js"></script>
<script src="js/vistas/vista2d.js"></script>
<script src="js/ui/lista-modulos.js"></script>
<script src="js/ui/parametros.js"></script>
<script src="js/ui/tabla-despiece.js"></script>
<script src="js/ui/planchas.js"></script>
<script src="js/ui/costeo.js"></script>
<script src="js/app.js"></script>
</body>
</html>
